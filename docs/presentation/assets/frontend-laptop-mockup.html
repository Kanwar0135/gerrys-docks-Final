<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      width: 1600px;
      height: 900px;
      display: grid;
      place-items: center;
      background:
        linear-gradient(135deg, rgba(15,111,107,.18), rgba(217,155,61,.14)),
        #f7f8f5;
      font-family: Arial, Helvetica, sans-serif;
      overflow: hidden;
    }
    .scene {
      width: 1400px;
      height: 760px;
      display: grid;
      place-items: center;
      position: relative;
    }
    .scene::before {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 20% 20%, rgba(255,255,255,.9), transparent 34%),
                  radial-gradient(circle at 80% 80%, rgba(15,111,107,.18), transparent 38%);
      filter: blur(2px);
    }
    .laptop {
      position: relative;
      width: 1180px;
      padding: 26px 26px 0;
      border-radius: 30px 30px 14px 14px;
      background: linear-gradient(145deg, #1b2428, #0d1114);
      box-shadow: 0 38px 80px rgba(23,33,38,.32);
    }
    .screen {
      width: 1128px;
      height: 635px;
      overflow: hidden;
      border-radius: 14px;
      background: #fff;
      border: 2px solid rgba(255,255,255,.12);
    }
    .screen img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }
    .base {
      width: 1280px;
      height: 52px;
      margin-left: -50px;
      border-radius: 0 0 42px 42px;
      background: linear-gradient(180deg, #cfd7d8, #8e9a9b);
      box-shadow: 0 26px 40px rgba(23,33,38,.22);
      position: relative;
    }
    .base::after {
      content: "";
      position: absolute;
      top: 0;
      left: 50%;
      width: 180px;
      height: 14px;
      transform: translateX(-50%);
      border-radius: 0 0 16px 16px;
      background: rgba(23,33,38,.22);
    }
  </style>
</head>
<body>
  <div class="scene">
    <div>
      <div class="laptop">
        <div class="screen">
          <img src="gerrys-frontend-screenshot.png" alt="Gerry's Docks frontend screenshot" />
        </div>
        <div class="base"></div>
      </div>
    </div>
  </div>
</body>
</html>
